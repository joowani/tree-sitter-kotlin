[package]
name = "tree-sitter-kt"
description = "Kotlin grammar for tree-sitter"
version = "0.1.0"
authors = ["Joohwan Oh <joohwan.oh@outlook.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "kotlin"]
categories = ["parser-implementations", "parsing", "text-editors"]
homepage = "https://github.com/joowani/tree-sitter-kotlin"
repository = "https://github.com/joowani/tree-sitter-kotlin"
edition = "2024"
rust-version = "1.90"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/grammar.js",
  "/queries/*",
  "/src/*",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
