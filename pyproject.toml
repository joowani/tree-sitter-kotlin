[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [{ name = "Joohwan Oh", email = "joohwan.oh@outlook.com" }]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Kotlin grammar for tree-sitter"
keywords = [ "incremental", "parsing", "tree-sitter", "kotlin" ]
license.text = "MIT"
name = "tree-sitter-kotlin"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Homepage = "https://github.com/joowani/tree-sitter-kotlin"

[project.optional-dependencies]
core = [ "tree-sitter>=0.25,!=0.26.0" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
