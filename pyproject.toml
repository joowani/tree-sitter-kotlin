[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-kotlin"
description = "Kotlin grammar for tree-sitter"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "kotlin"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Joohwan Oh", email = "joohwan.oh@outlook.com" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/joowani/tree-sitter-kotlin"

[project.optional-dependencies]
core = ["tree-sitter>=0.25,!=0.26.0"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
